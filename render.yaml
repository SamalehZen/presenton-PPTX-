services:
  - type: web
    name: presenton
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: MIGRATE_DATABASE_ON_STARTUP
        value: "true"
      - key: CAN_CHANGE_KEYS
        value: "true"
      - key: DISABLE_ANONYMOUS_TRACKING
        value: "true"
      - key: LLM
        value: google
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: models/gemini-3.1-flash-lite-preview
      - key: IMAGE_PROVIDER
        value: nanobanana_2
